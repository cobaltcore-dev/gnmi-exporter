apiVersion: monitoring.networking.cloud.sap/v1alpha1
kind: DeviceMonitor
metadata:
  labels:
    app.kubernetes.io/name: gnmi-exporter
    app.kubernetes.io/managed-by: kustomize
    topology.kubernetes.io/region: eu-de-1
    topology.kubernetes.io/zone: eu-de-1a
  name: devicemonitor-sample
  namespace: monitoring
spec:
  replicas: 3
  deviceSelector:
    matchLabels:
      topology.kubernetes.io/zone: eu-de-1a
  template:
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: eu-de-1a
  subscriptions:
    - name: operSt
      paths:
        - /System/intf-items/phys-items/PhysIf-list[id=eth1/1]/phys-items/operSt
        - /System/intf-items/phys-items/PhysIf-list[id=eth1/2]/phys-items/operSt
        - /System/intf-items/phys-items/PhysIf-list[id=eth1/10]/phys-items/operSt
      mode: Stream
      streamMode: Sample
      sampleInterval: 1s
  encoding: json
---
apiVersion: networking.metal.ironcore.dev/v1alpha1
kind: Device
metadata:
  labels:
    app.kubernetes.io/name: gnmi-exporter
    app.kubernetes.io/managed-by: kustomize
    topology.kubernetes.io/region: eu-de-1
    topology.kubernetes.io/zone: eu-de-1a
  name: leaf1
  namespace: default
spec:
  endpoint:
    address: 192.168.5.2:9339
    secretRef:
      name: secret-basic-auth
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: gnmi-exporter
    app.kubernetes.io/managed-by: kustomize
  name: secret-basic-auth
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: admin
