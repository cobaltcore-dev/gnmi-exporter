# This rule is not used by the project gnmi-exporter itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over monitoring.networking.cloud.sap.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gnmi-exporter
    app.kubernetes.io/managed-by: kustomize
  name: devicemonitor-admin-role
rules:
- apiGroups:
  - monitoring.networking.cloud.sap
  resources:
  - devicemonitors
  verbs:
  - '*'
- apiGroups:
  - monitoring.networking.cloud.sap
  resources:
  - devicemonitors/status
  verbs:
  - get
