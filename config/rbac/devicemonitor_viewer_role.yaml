# This rule is not used by the project gnmi-exporter itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to monitoring.networking.cloud.sap resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gnmi-exporter
    app.kubernetes.io/managed-by: kustomize
  name: devicemonitor-viewer-role
rules:
- apiGroups:
  - monitoring.networking.cloud.sap
  resources:
  - devicemonitors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - monitoring.networking.cloud.sap
  resources:
  - devicemonitors/status
  verbs:
  - get
