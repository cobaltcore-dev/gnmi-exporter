name: goreleaser
"on":
  push:
    tags:
      - '*'
permissions:
  contents: write
  packages: write
jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/ironcore-dev/*
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: 1.25.3
      - name: Setup Private Go Module Access via SSH Key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.GO_MODULE_PRIVATE_KEY }}"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          git config --global url."git@github.com:ironcore-dev".insteadOf "https://github.com/ironcore-dev"
      - name: Run prepare make target
        run: make generate
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate release info
        run: |
          go install github.com/sapcc/go-bits/tools/release-info@latest
          mkdir -p build
          release-info CHANGELOG.md "$(git describe --tags --abbrev=0)" > build/release-info
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean --release-notes=./build/release-info
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
