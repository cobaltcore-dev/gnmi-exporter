name: Test Chart

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  test-chart:
    name: Run Chart Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: latest
      - name: Lint Helm Chart
        run: |
          helm lint ./charts/gnmi-exporter
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.31.0
          kubectl_version: v1.35.0
          cluster_name: kind
      - name: Prepare gnmi-exporter
        run: |
          go mod download
          make docker-build IMG=gnmi-exporter:v0.1.0
          kind load docker-image gnmi-exporter:v0.1.0
      - name: Install cert-manager via Helm
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set installCRDs=true
      - name: Wait for cert-manager to be ready
        run: |
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager-cainjector
          kubectl wait --namespace cert-manager --for=condition=available --timeout=300s deployment/cert-manager-webhook
      - name: Install Prometheus Operator CRDs
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus-crds prometheus-community/prometheus-operator-crds
      - name: Install Prometheus via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus prometheus-community/prometheus --namespace monitoring --create-namespace
      - name: Wait for Prometheus to be ready
        run: |
          kubectl wait --namespace monitoring --for=condition=available --timeout=300s deployment/prometheus-server
      - name: Install Helm Chart
        run: |
          helm install gnmi-exporter ./charts/gnmi-exporter --create-namespace --namespace gnmi-exporter-system --set manager.image.repository=gnmi-exporter --set manager.image.tag=v0.1.0 --set prometheus.enable=true
      - name: Check Helm release status
        run: |
          helm status gnmi-exporter --namespace gnmi-exporter-system
      - name: Check Presence of ServiceMonitor
        run: |
          kubectl wait --namespace gnmi-exporter-system --for=jsonpath='{.kind}'=ServiceMonitor servicemonitor/gnmi-exporter-controller-manager-metrics-monitor
