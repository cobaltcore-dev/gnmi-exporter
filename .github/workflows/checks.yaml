name: Checks
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}
permissions:
  checks: write
  contents: read
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/ironcore-dev/*
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: 1.25.1
      - name: Setup Private Go Module Access via SSH Key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.GO_MODULE_PRIVATE_KEY }}"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          git config --global url."git@github.com:ironcore-dev".insteadOf "https://github.com/ironcore-dev"
      - name: Run prepare make target
        run: make generate
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Delete pre-installed shellcheck
        run: sudo rm -f $(which shellcheck)
      - name: Run shellcheck
        run: make run-shellcheck
      - name: Dependency Licenses Review
        run: make check-dependency-licenses
      - name: Check for spelling errors
        uses: reviewdog/action-misspell@v1
        with:
          exclude: ./vendor/*
          fail_on_error: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ignore: importas
          reporter: github-check
      - name: Check if source code files have license header
        run: make check-addlicense
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck -format text ./...
